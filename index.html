<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PriceSnap</title>
    <meta name="description" content="AI item scanner with live market search for Trade Me, Facebook Marketplace, and eBay. Get real-time resale values for secondhand goods in seconds." />
    <meta property="og:title" content="PriceSnap" />
    <meta property="og:description" content="AI item scanner with live market search for Trade Me, Facebook Marketplace, and eBay. Get real-time resale values for secondhand goods in seconds." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PriceSnap PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="background-color" content="#0A1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PriceSnap" />
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <meta name="application-name" content="PriceSnap" />
    <script>
      // Early protection: intercept cross-origin frame isolation errors in preview sandbox
      (function() {
        function isCrossOriginError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err || '');
          return (
            str.indexOf("Failed to read a named property 'origin' from 'Location'") !== -1 ||
            str.indexOf('Blocked a frame with origin') !== -1 ||
            str.indexOf('cross-origin frame') !== -1
          );
        }

        window.addEventListener('error', function(e) {
          if (isCrossOriginError(e.error || e)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isCrossOriginError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe Service Worker registration only in production / top-level context
      try {
        if ('serviceWorker' in navigator && window.location && typeof window.location.protocol === 'string' && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', () => {
            try {
              navigator.serviceWorker
                .register('/sw.js')
                .then((reg) => {
                  // registered
                })
                .catch(() => {
                  // silently handle in preview frames
                });
            } catch {
              // ignore
            }
          });
        }
      } catch {
        // ignore
      }
    </script>
  </body>
</html>
